name: Deploy to GCS

on:
  push:

  workflow_dispatch:

jobs:
  job_id:
    # Any runner supporting Node 20 or newer
    runs-on: ubuntu-latest

    # Add "id-token" with the intended permissions.
    permissions:
      contents: 'read'
      id-token: 'write'

    steps:
      - uses: 'actions/checkout@v4'

      - uses: 'google-github-actions/auth@v2'
        with:
          project_id: 'moontuni-robin'
          workload_identity_provider: 'projects/717460429507/locations/global/workloadIdentityPools/github-pool/providers/github-provider'


      - name: Upload to Cloud Storage
        uses: google-github-actions/upload-cloud-storage@v2
        with:
          path: dist/
          destination: ${{ secrets.GCP_BUCKET_NAME }}
          parent: false